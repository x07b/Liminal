name: Verify website
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: ["", "https://api.example.com"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vercel
        env:
          BACKEND_ORIGIN: ${{ matrix.backend }}
      - run: npm test
      - run: npm run validate:vercel
      - run: docker build -t liminal-check .
